version: "3.5"
services:
  coherence1:
    hostname: server1
    networks:
      coherence:
        aliases:
          - server1
    image: ${DOCKER_REGISTRY}/${COHERENCE_TYPE}:${COHERENCE_VERSION}
    user: "${COHERENCE_TEST_USER:-0:0}"
    environment:
      - COHERENCE_WKA=server1
      - COHERENCE_CLUSTER=${COMPOSE_PROJECT_NAME:-coherence-js-test}
    ports:
      - "30000:30000"
      - "1408:1408"
      - "9612:9612"
      - "8080:8080"
      - "6676:6676"
      - "7574:7574"
    volumes:
      - ${COHERENCE_TEST_ARGS_DIR:-.}/jvm-args.txt:/args/jvm-args.txt:ro
      - ${COHERENCE_TEST_CERTS_DIR:-./cert/server}:/certs:ro

  coherence2:
    hostname: server2
    networks:
      coherence:
        aliases:
          - server2
    image: ${DOCKER_REGISTRY}/${COHERENCE_TYPE}:${COHERENCE_VERSION}
    user: "${COHERENCE_TEST_USER:-0:0}"
    environment:
      - COHERENCE_WKA=server1
      - COHERENCE_CLUSTER=${COMPOSE_PROJECT_NAME:-coherence-js-test}
    ports:
      - "9613:9613"
    volumes:
      - ${COHERENCE_TEST_ARGS_DIR:-.}/jvm-args.txt:/args/jvm-args.txt:ro
      - ${COHERENCE_TEST_CERTS_DIR:-./cert/server}:/certs:ro

networks:
  coherence:
