# ---------------------------------------------------------------------------
# Coherence JavaScript Client GitHub Actions CI build.
# ---------------------------------------------------------------------------

name: JS Client Discovery Validation

on:
  schedule:
    - cron: "0 5 * * *"
  push:
    branches-ignore:
    - ghpages
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
    - '*'

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
        coherence-version: [22.06.12, 14.1.2-0-3, 25.03.2]

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ matrix.node-version }}
    - name: Use npm 11.20.0
      run: npm install --global npm@11.20.0
    - run: npm ci
    - run: npm run compile

    - name: Run Coherence Server
      shell: bash
      env:
        # Update the reviewed upstream revision and its SHA-256 together.
        COHCTL_INSTALL_URL: https://raw.githubusercontent.com/oracle/coherence-cli/d4caefa879f186d6969d9b669a9942bf6229e61e/scripts/install.sh
        COHCTL_INSTALL_SHA256: f1d57a9c1560cc4a4737e01ed483aa8cfe6f86024d15794e659a6796d91d0410
      run: |
        export COHERENCE_VERSION=${{ matrix.coherence-version }}
        install_script="$(mktemp)"
        trap 'rm -f "$install_script"' EXIT
        curl -fsSL "$COHCTL_INSTALL_URL" -o "$install_script"
        echo "${COHCTL_INSTALL_SHA256}  ${install_script}" | sha256sum -c -
        bash "$install_script"
        cohctl version
        cohctl set profile grpc-cluster1 -v "-Dcoherence.grpc.server.port=10000" -y
        cohctl create cluster grpc-cluster1 -P grpc-cluster1 -r 1 -v ${{ matrix.coherence-version }} -y -a coherence-grpc-proxy
        cohctl set profile grpc-cluster2 -v "-Dcoherence.grpc.server.port=10001" -y
        cohctl create cluster grpc-cluster2 -P grpc-cluster2 -r 1 -H 30001 -v ${{ matrix.coherence-version }} -y -a coherence-grpc-proxy
        sleep 20
        cohctl monitor health -n localhost:7574 -T 40 -w

    - name: Run resolver tests
      shell: bash
      run: |
        npm run test-resolver

    - name: Archive production artifacts
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: save-log-file-${{ matrix.node-version }}-${{ matrix.coherence-version }}
        path: ~/.cohctl/logs/*.*.log
