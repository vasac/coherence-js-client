# ---------------------------------------------------------------------------
# Coherence JS Client GitHub Actions Dependency Security Gate
# ---------------------------------------------------------------------------
name: Dependency Security

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore:
      - ghpages
  workflow_dispatch:
  schedule:
    # Every day at midnight
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  dependency-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use Node.js 26.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.x
      - name: Use npm 11.20.0
        run: npm install --global npm@11.20.0
      - name: Check dependency gate regressions
        run: node --test test/security-gate-tests.cjs
      - name: Gate dependency security
        uses: ./.github/actions/dependency-security
        with:
          artifact-name: dependency-security
