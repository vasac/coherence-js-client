name: Dependency security gate
description: Audit production and full npm trees and scan with Trivy, including development dependencies
inputs:
  artifact-name:
    description: Name of the retained scan reports
    required: true
runs:
  using: composite
  steps:
    - name: Install Trivy 0.76.2
      uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
      with:
        version: v0.76.2
    - name: Require zero known dependency findings
      # Still collect npm reports if the Trivy installer failed. Its failure is retained.
      if: ${{ !cancelled() }}
      shell: bash
      env:
        TRIVY_CACHE_DIR: ${{ runner.temp }}/dependency-trivy-cache
      run: node bin/dependency-security.js "$RUNNER_TEMP/dependency-security"
    - name: Retain dependency scan reports
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/dependency-security/
        if-no-files-found: error
